name: Action Continuous Integration
on:
    workflow_dispatch:
    push:
        branches:
            - dev
permissions:
    contents: read
    models: read
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"
                  cache: npm
            # Cache the generated model requests made by GenAIScript
            #
            # A new cache is created for each run to ensure that the latest model requests are used,
            # but previous caches can be restored and reused if available.
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .genaiscript/cache/**
                  key: genaiscript-${{ github.workflow }}-${{ github.run_id }}
                  restore-keys: |
                      genaiscript-
            - run: npm ci
            - run: npm run build
    test-action:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Cache the generated model requests made by GenAIScript
            #
            # A new cache is created for each run to ensure that the latest model requests are used,
            # but previous caches can be restored and reused if available.
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .genaiscript/cache/**
                  key: genaiscript-${{ github.workflow }}-${{ github.run_id }}
                  restore-keys: |
                      genaiscript-
            - uses: ./
              with:
                  prompt: |
                      system:
                      Is this joke funny?
                      user:
                      {{ input }}
                  effort: min
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  debug: "script"
