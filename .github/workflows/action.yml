name: Action Continuous Integration
on:
    workflow_dispatch:
    push:
        branches:
            - dev
permissions:
    contents: read
    models: read
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22"
                  cache: npm
            # Cache the generated model requests made by GenAIScript
            #
            # A new cache is created for each run to ensure that the latest model requests are used,
            # but previous caches can be restored and reused if available.
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: .genaiscript/cache/**
                  key: genaiscript-${{ github.workflow }}-${{ github.run_id }}
                  restore-keys: |
                      genaiscript-
            - run: npm ci
            - run: npm run build
    test-action:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            # Cache the generated model requests made by GenAIScript
            #
            # A new cache is created for each run to ensure that the latest model requests are used,
            # but previous caches can be restored and reused if available.
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: .genaiscript/cache/**
                  key: genaiscript-${{ github.workflow }}-${{ github.run_id }}
                  restore-keys: |
                      genaiscript-
            - uses: ./
              with:
                  prompt: |
                      system:
                      Is this joke funny?
                      user:
                      {{ input }}
                  effort: min
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  debug: "script"
